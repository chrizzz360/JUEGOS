<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio de Juegos Personal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="h-full flex flex-col font-sans antialiased bg-slate-950 text-slate-100">

    <!-- Header / Top Bar -->
    <header class="sticky top-0 z-30 border-b border-slate-800/80 bg-slate-950/90 backdrop-blur-md">
        <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between gap-4">
            <!-- Search Bar -->
            <div class="relative w-full max-w-xs">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input type="text" id="searchInput" placeholder="Buscar en repositorio..." 
                    class="w-full pl-9 pr-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-all">
            </div>

            <!-- Game Counter Badge -->
            <span id="gameCount" class="text-[11px] font-mono text-slate-400 bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-800/80">
                0 juegos
            </span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6">
        <!-- Grid list of games -->
        <div id="gamesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
            <!-- Game cards injected dynamically -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
            <i data-lucide="folder-open" class="w-8 h-8 text-slate-600 mb-2"></i>
            <p class="text-xs text-slate-500">No se encontraron carpetas de juegos</p>
        </div>
    </main>

    <!-- Fullscreen Game Modal (Iframe Container) -->
    <div id="gameModal" class="fixed inset-0 z-50 bg-slate-950/95 hidden flex-col opacity-0 transition-opacity duration-200">
        <!-- Modal Bar -->
        <div class="h-12 px-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i id="modalIcon" data-lucide="gamepad-2" class="w-4 h-4 text-indigo-400"></i>
                <h3 id="modalTitle" class="text-xs font-bold text-slate-200 tracking-wide">Juego</h3>
                <span id="modalFolder" class="text-[10px] font-mono text-slate-500 bg-slate-950 px-2 py-0.5 rounded border border-slate-800 ml-2"></span>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="toggleFullscreen()" class="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition-colors" title="Pantalla completa">
                    <i data-lucide="maximize" class="w-4 h-4"></i>
                </button>
                <button onclick="closeGameModal()" class="flex items-center gap-1 px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg transition-all">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i> Cerrar
                </button>
            </div>
        </div>

        <!-- Iframe Container -->
        <div class="flex-1 w-full h-full relative bg-black">
            <iframe id="gameIframe" class="w-full h-full border-0" allow="autoplay; keyboard; fullscreen" src=""></iframe>
        </div>
    </div>

    <!-- Script Configuration & Logic -->
    <script>
        /**
         * REPOSICIONAL DE JUEGOS LOCALES (Modifícalo para añadir carpetas en el futuro)
         */
        const GAMES = [
            { 
                title: 'Pac-Man', 
                folder: 'PACMAN/index.html', 
                icon: 'ghost', 
                category: 'Arcade' 
            },
            { 
                title: 'tetris', 
                folder: 'TETRIS/index.html', 
                icon: 'blocks', 
                category: 'Puzzle' 
            }
        ];

        // DOM References
        const gamesGrid = document.getElementById('gamesGrid');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const gameCount = document.getElementById('gameCount');
        const gameModal = document.getElementById('gameModal');
        const gameIframe = document.getElementById('gameIframe');
        const modalTitle = document.getElementById('modalTitle');
        const modalFolder = document.getElementById('modalFolder');
        const modalIcon = document.getElementById('modalIcon');

        // Init
        function init() {
            renderGames(GAMES);
            
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                const filtered = GAMES.filter(g => 
                    g.title.toLowerCase().includes(query) || 
                    g.folder.toLowerCase().includes(query) ||
                    g.category.toLowerCase().includes(query)
                );
                renderGames(filtered);
            });
        }

        // Render List
        function renderGames(list) {
            gameCount.textContent = `${list.length} juego${list.length === 1 ? '' : 's'}`;

            if (list.length === 0) {
                gamesGrid.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');

            gamesGrid.innerHTML = list.map(game => `
                <div class="bg-slate-900/60 border border-slate-800/80 hover:border-slate-700/80 rounded-xl p-3.5 flex flex-col justify-between transition-all group">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="p-2 rounded-lg bg-slate-800/60 border border-slate-700/50 text-indigo-400 group-hover:bg-indigo-600 group-hover:text-white transition-all">
                                <i data-lucide="${game.icon}" class="w-4 h-4"></i>
                            </span>
                            <span class="text-[10px] text-slate-400 bg-slate-950 px-2 py-0.5 rounded border border-slate-800/80 font-mono">
                                ${game.category}
                            </span>
                        </div>
                        <h3 class="text-sm font-bold text-slate-100 mb-0.5 tracking-wide">${game.title}</h3>
                        <p class="text-[11px] font-mono text-slate-400 truncate mb-3">${game.folder}</p>
                    </div>

                    <div class="flex items-center gap-2 pt-2 border-t border-slate-800/60">
                        <button onclick="launchGame('${game.folder}', '${game.title}', '${game.icon}')" 
                            class="flex-1 py-1.5 px-3 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg flex items-center justify-center gap-1.5 transition-all">
                            <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i> Jugar
                        </button>
                        <a href="${game.folder}" target="_blank" title="Abrir en pestaña nueva"
                            class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition-colors">
                            <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                        </a>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        // Launch Modal Iframe
        function launchGame(folder, title, icon) {
            modalTitle.textContent = title;
            modalFolder.textContent = folder;
            modalIcon.setAttribute('data-lucide', icon);
            lucide.createIcons();

            gameIframe.src = folder;
            gameModal.classList.remove('hidden');
            setTimeout(() => gameModal.classList.remove('opacity-0'), 10);
        }

        function closeGameModal() {
            gameModal.classList.add('opacity-0');
            setTimeout(() => {
                gameModal.classList.add('hidden');
                gameIframe.src = '';
            }, 200);
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                gameModal.requestFullscreen().catch(err => console.warn(err));
            } else {
                document.exitFullscreen();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !gameModal.classList.contains('hidden')) {
                closeGameModal();
            }
        });

        window.onload = init;
    </script>
</body>
</html>
